6" /><text x="411" y="520" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="411" dy="0">Local theme JSON</tspan><tspan x="411" dy="27.0">Ten configured themes</tspan><tspan x="411" dy="27.0">No provider call in polisher</tspan></text><path d="M545 484 l0 -32" fill="none" stroke="#243746" stroke-width="2" /><polygon points="545,452 549.794255386042,460.77582561890375 540.205744613958,460.77582561890375" fill="#243746"/><rect x="32" y="489" width="275" height="91" rx="8" fill="#f3f6f8" stroke="#243746" stroke-dasharray="6 5"/><text x="48" y="520" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="48" dy="0">Optional FireCrawl / MCP</tspan><tspan x="48" dy="27.0">External service + key</tspan><tspan x="48" dy="27.0">UNVERIFIED / not required</tspan></text><path d="M313 536 l75 0" fill="none" stroke="#243746" stroke-width="2" stroke-dasharray="6 5"/><polygon points="388,536 379.22417438109625,540.794255386042 379.22417438109625,531.205744613958" fill="#243746"/><rect x="780" y="489" width="284" height="91" rx="8" fill="#f3f6f8" stroke="#243746" /><text x="796" y="520" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="796" dy="0">Untested source risks</tspan><tspan x="796" dy="27.0">Ordering / cell text loss</tspan><tspan x="796" dy="27.0">Equal paths not rejected</tspan></text><text x="32" y="635" fill="#243746" font-family="Arial, sans-serif" font-size="23"><tspan x="32" dy="0">03   Separate rights boundaries / no blanket MIT grant</tspan></text><rect x="32" y="656" width="249" height="119" rx="8" fill="#f3f6f8" stroke="#243746" /><text x="48" y="687" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="48" dy="0">Root MIT + caveats</tspan><tspan x="48" dy="27.0">Brand disclaimer retained</tspan><tspan x="48" dy="27.0">No endorsement implied</tspan></text><rect x="293" y="656" width="249" height="119" rx="8" fill="#f3f6f8" stroke="#243746" /><text x="309" y="687" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="309" dy="0">Four document skills</tspan><tspan x="309" dy="27.0">Anthropic restrictions</tspan><tspan x="309" dy="27.0">Clarify rights first</tspan></text><rect x="554" y="656" width="249" height="119" rx="8" fill="#f3f6f8" stroke="#243746" /><text x="570" y="687" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="570" dy="0">Eleven Apache-2.0 skills</tspan><tspan x="570" dy="27.0">Keep licenses + credits</tspan><tspan x="570" dy="27.0">No relicensing here</tspan></text><rect x="815" y="656" width="249" height="119" rx="8" fill="#f3f6f8" stroke="#243746" /><text x="831" y="687" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="831" dy="0">Community fonts</tspan><tspan x="831" dy="27.0">27 OFL notice files</tspan><tspan x="831" dy="27.0">Keep names + notices</tspan></text><text x="32" y="827" fill="#243746" font-family="Arial, sans-serif" font-size="20"><tspan x="32" dy="0">Credits: upstream history records promptadvisers + Claude co-authorship.</tspan></text><text x="32" y="861" fill="#243746" font-family="Arial, sans-serif" font-size="20"><tspan x="32" dy="0">Anthropic and community authors retain their notices. JD delta here: docs and map only.</tspan></text><text x="32" y="909" fill="#243746" font-family="Arial, sans-serif" font-size="19"><tspan x="32" dy="0">Baseline: d4c4509ae85f44d6c95b2cdebc5f5746845a3664</tspan></text><text x="32" y="947" fill="#243746" font-family="Arial, sans-serif" font-size="20"><tspan x="32" dy="0">No skill, script, font, document, license, or notice payload changed.</tspan></text><text x="32" y="983" fill="#243746" font-family="Arial, sans-serif" font-size="20"><tspan x="32" dy="0">No installs, processing, provider execution, or credential validation performed.</tspan></text></svg>
