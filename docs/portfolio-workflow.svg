<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1050" role="img" aria-labelledby="title desc"><title id="title">Reference fork: workflow and provenance</title><desc id="desc">Source-inferred workflow, not an execution trace. Inherited source and new docs are separate. FireCrawl is optional and unverified. Mixed licenses remain separate.</desc><rect width="1100" height="1050" fill="#ffffff"/><text x="32" y="50" fill="#243746" font-family="Arial, sans-serif" font-size="30"><tspan x="32" dy="0">Reference fork / workflow &amp; provenance</tspan></text><text x="32" y="86" fill="#243746" font-family="Arial, sans-serif" font-size="20"><tspan x="32" dy="0">Source-inferred · native setup NOT RUN · reviewed 2026-11-12 UTC</tspan></text><text x="32" y="135" fill="#243746" font-family="Arial, sans-serif" font-size="23"><tspan x="32" dy="0">01   Inherited source is not JD-original implementation</tspan></text><rect x="32" y="155" width="310" height="116" rx="8" fill="#f3f6f8" stroke="#243746" /><text x="48" y="186" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="48" dy="0">GitHub parent / network</tspan><tspan x="48" dy="27.0">michellelandon collection</tspan><tspan x="48" dy="27.0">README: promptadvisers</tspan></text><rect x="393" y="155" width="310" height="116" rx="8" fill="#f3f6f8" stroke="#243746" /><text x="409" y="186" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="409" dy="0">Shared baseline (before docs)</tspan><tspan x="409" dy="27.0">d4c4509ae85f…</tspan><tspan x="409" dy="27.0">No JD implementation delta</tspan></text><rect x="754" y="155" width="310" height="116" rx="8" fill="#f3f6f8" stroke="#243746" /><text x="770" y="186" fill="#243746" font-family="Arial, sans-serif" font-size="18"><tspan x="770" dy="0">This fork: new docs</tspan><tspan x="770" dy="27.0">Safe setup + provenance</tspan><tspan x="770" dy="27.0">Editable map / AI-assisted</tspan></text><path d="M347 211 l40 0" fill="none" stroke="#243746" 